name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

jobs:
  quality:
    name: Lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Real PostgreSQL, not SQLite: migrations and the boot check then run against
    # the same driver (asyncpg) and server version used in production.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: coach
          POSTGRES_PASSWORD: coach_ci_password
          POSTGRES_DB: coach_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U coach -d coach_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Placeholder credentials so config validation passes. The suite is fully
      # offline (AI calls are faked), so no real secret is ever needed in CI.
      BOT_TOKEN: "123456789:CI-token-not-real"
      NANOGPT_API_KEY: "ci-key-not-real"
      ADMIN_IDS: "1"
      DATABASE_URL: "postgresql+asyncpg://coach:coach_ci_password@localhost:5432/coach_ci"
      DB_AUTO_CREATE: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libraries (Pillow, Arabic fonts for charts/PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libjpeg-dev zlib1g-dev fonts-dejavu-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      # Split into one command per step: a failure names the exact broken command
      # in the job summary, which is easier to act on than a wall of logs.
      - name: PostgreSQL is reachable
        run: python scripts/verify_schema.py --ping

      # Actions logs are not always fetchable, so on failure the PostgreSQL error
      # is re-emitted as a check annotation, which the API does return.
      - name: Alembic upgrade head
        run: |
          set +e
          out=$(alembic upgrade head 2>&1)
          status=$?
          echo "$out"
          if [ "$status" -ne 0 ]; then
            detail=$(echo "$out" | grep -E "Error|ERROR|Exception|DETAIL|HINT|LINE [0-9]" | tail -8 | tr '\n' ' ' | tr -d '\r' | cut -c1-800)
            echo "::error title=alembic upgrade head failed::${detail:-exit $status with no matching error line}"
            exit "$status"
          fi

      - name: Schema has every expected table
        run: python scripts/verify_schema.py --expect 21

      - name: Alembic reports no model drift
        run: alembic check

      - name: Every module imports and the dispatcher builds
        run: ./scripts/run.sh --check

      - name: Pytest (offline — no network, no secrets needed)
        run: pytest -q --maxfail=5

      - name: Config, docs and dependency drift guards
        run: pytest tests/test_config_docs.py tests/test_dependencies.py -q
